<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>StarBunny's Website</title>
    <style>
        @font-face {
            font-family: "KodeMono";
            src: url("/Assets/Fonts/Kode_Mono/static/KodeMono-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "KodeMono";
            src: url("/Assets/Fonts/Kode_Mono/static/KodeMono-Bold.ttf") format("woff2");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        *{
            box-sizing: border-box;
        }
        body {
            /*background-image: url('Assets/Images/Backgrounds/draft4LessOpacity.png');*/
            /*background-repeat: no-repeat;*/
            /*background-size: cover;*/
            /*background-position: center;*/
            /*background-attachment: fixed;*/
            background-color: lightyellow;
            font-family: "KodeMono", sans-serif;
            display: flex;
            flex-direction: row;
            gap: 10px;
            margin: 10px 20px 10px 10px;

        }
        ul {
            list-style-type: none;
            background-color: white;
            width: 200px;
            height: 200px;
            box-shadow: 5px 5px 1px rgba(0, 0, 0, 0.500);
            border: 3px black solid;

            display: flex;
            flex-direction: column;
            margin: 10px;
            padding: 10px;

            overflow-y: scroll;
        }
        ul li a {
            text-decoration: none;
            color: black;
        }
        .main-area{
            background-color: white;
            width: 1000px;
            height: auto;
            min-height: 200px;
            max-height: 90vh;
            box-shadow: 5px 5px 1px rgba(0, 0, 0, 0.500);
            border: 3px black solid;
            padding: 3px;
            margin: 10px auto;
            overflow-y: scroll;
            overflow-x: hidden;
        }
        .main-area-image {
            width: 100%;
            height: 200px; /* Choose your desired banner height */
            object-fit: cover;
            object-position: center;
            display: block;
            box-shadow: 0px 0px 2px rgba(0, 0, 0, 0.500);
        }
        .main-area-text {
            padding: 10px;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        .project{
            display: flex;
            flex-direction: row;
            align-items: center;
            height: 200px;
            background-color: white;
            margin: 10px;
            outline: 3px solid black;
            box-shadow: 1px 1px 1px rgba(0, 0, 0, 0.500);
            overflow: clip;
        }
        .project-image{
            height: auto;
            max-height: calc(100% - 20px);
            margin-left: 10px;
            outline: 1px solid black;
            box-shadow: 0px 0px 2px rgba(0, 0, 0, 0.500);
        }
        .project-text{
            background-color: white;
            flex: 1;
            align-self: stretch;
            margin: 10px;
            padding: 10px;
            outline: 1px solid black;

            overflow-y: scroll;
        }
    </style>
</head>
